name: Rust CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --lib -- -D warnings
      - run: cargo clippy --locked --bins -- -D warnings
      - run: cargo clippy --locked --tests -- -D warnings
      - run: cargo test --locked --lib
      - run: cargo test --locked --tests
