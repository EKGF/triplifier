name: Python wheels
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [pyproject.toml, packaging/**, Cargo.toml, Cargo.lock, .github/workflows/wheels.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: wheel ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-24.04,     manylinux: "2_28" }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, manylinux: "2_28" }
          - { target: x86_64-apple-darwin,       runner: macos-15-intel,   manylinux: "off" }
          - { target: aarch64-apple-darwin,      runner: macos-15,         manylinux: "off" }
          - { target: x86_64-pc-windows-msvc,    runner: windows-latest,   manylinux: "off" }
          - { target: aarch64-pc-windows-msvc,   runner: windows-11-arm,   manylinux: "off" }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          rust-toolchain: nightly-2026-10-30
          args: --release --locked --strip --out dist
      - name: Smoke-test the installed command
        shell: bash
        run: |
          python -m venv .smoke || exit $?
          if [[ -x .smoke/bin/python ]]; then py=.smoke/bin/python; bin=.smoke/bin; else py=.smoke/Scripts/python.exe; bin=.smoke/Scripts; fi
          "$py" -m pip install --no-index --find-links dist triplifier || exit $?
          printf 'a,b\n1,00123\n' > smoke.csv || exit $?
          "$bin/triplifier" --version || exit $?
          "$bin/triplifier" smoke.csv -o smoke.nq || exit $?
          grep -q '"00123"' smoke.nq || { printf 'smoke output lacks the CSV value\n' >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
